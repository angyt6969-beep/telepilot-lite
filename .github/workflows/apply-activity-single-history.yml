name: Apply Activity single history fix

on:
  push:
    branches:
      - fix/activity-single-history

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/activity-single-history
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply guarded fix
        run: node scripts/apply-activity-single-history.mjs

      - name: Syntax checks
        run: |
          node --check navigation-cleanup-v1.js
          node --check navigation-cleanup-v1-test.mjs

      - name: Targeted Activity navigation test
        run: node navigation-cleanup-v1-test.mjs

      - name: Full regression suite
        run: |
          export TELEPILOT_SECURITY_SECRET="$(node -p "'x'.repeat(48)")"
          export TELEPILOT_SESSION_KEY_B64="$(node -p "Buffer.alloc(32, 11).toString('base64')")"
          export DATA_DIR=/tmp/telepilot-activity-history-ci
          npm test

      - name: Diff check
        run: git diff --check

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Keep one working Posting History button in Activity"
          git push origin HEAD:fix/activity-single-history
