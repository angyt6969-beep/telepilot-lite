name: Core TelePilot reliability rewrite v2

on:
  push:
    paths:
      - .github/workflows/core-audit-rewrite-v2.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reuse audited rewrite with corrected test writer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          raw = Path('.github/workflows/core-audit-rewrite.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY\n", start)
          script = dedent(raw[start:end])
          old_start = "test_path.write_text(r'''"
          old_end = "''').replace(\"          \", \"\")"
          if script.count(old_start) != 1 or script.count(old_end) != 1:
              raise SystemExit('Could not locate the failed test writer exactly once')
          script = script.replace(old_start, "test_text = r'''", 1)
          script = script.replace(old_end, "'''.replace(\"          \", \"\")\ntest_path.write_text(test_text)", 1)
          Path('/tmp/core-rewrite.py').write_text(script)
          PY
          python3 /tmp/core-rewrite.py

      - name: Install dependencies
        run: npm ci

      - name: Validate rewritten source
        run: |
          node --check app.js
          node --check v1-worker.js
          node core-audit-regression-test.mjs

      - name: Commit source rewrite and remove temporary runners
        run: |
          rm .github/workflows/core-audit-rewrite.yml .github/workflows/core-audit-rewrite-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rewrite core posting reliability after audit"
          git push origin HEAD:main
