name: Apply UI clutter cleanup v2
on:
  workflow_dispatch:
  push:
    branches: [fix/ui-clutter-cleanup-v2]
    paths:
      - '.github/workflows/ui-clutter-cleanup-v2.yml'
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-clutter-cleanup-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply guarded startup and test wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('startup.js')
          s = p.read_text()
          marker = '\nconst BOT_TOKEN = process.env.BOT_TOKEN;'
          addition = '\nimport { installUiClutterNavigationV2 } from "./ui-clutter-cleanup-v2.js";\n'
          if addition.strip() not in s:
              assert marker in s, 'startup BOT_TOKEN marker changed'
              s = s.replace(marker, addition + marker, 1)
          call_marker = 'installDestinationDeleteAll(Bot);'
          call = '\n// Final navigation cleanup registers last so retired Smart Preview callbacks and\n// compact destination disclosure routes get callback priority.\ninstallUiClutterNavigationV2(Bot);'
          if 'installUiClutterNavigationV2(Bot);' not in s:
              assert call_marker in s, 'destination delete-all install marker changed'
              s = s.replace(call_marker, call_marker + call, 1)
          p.write_text(s)

          p = Path('package.json')
          s = p.read_text()
          old = '"start": "node --import ./tutorial-navigation-priority.js'
          new = '"start": "node --import ./ui-clutter-cleanup-v2.js --import ./tutorial-navigation-priority.js'
          if new not in s:
              assert old in s, 'package start command changed'
              s = s.replace(old, new, 1)
          old_test = 'node referral-custom-interval-test.mjs"'
          new_test = 'node referral-custom-interval-test.mjs && node ui-clutter-cleanup-v2-test.mjs"'
          if new_test not in s:
              assert old_test in s, 'v13 test tail changed'
              s = s.replace(old_test, new_test, 1)
          p.write_text(s)
          PY
      - name: Syntax checks
        run: |
          node --check ui-clutter-cleanup-v2.js
          node --check startup.js
      - name: Targeted UI cleanup test
        run: node ui-clutter-cleanup-v2-test.mjs
      - name: Full regression suite
        env:
          TELEPILOT_SECURITY_SECRET: test-only-ui-cleanup-secret-0123456789abcdef
          TELEPILOT_SESSION_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add startup.js package.json
          if ! git diff --cached --quiet; then
            git commit -m 'Wire compact UI cleanup layer'
            git push origin HEAD:fix/ui-clutter-cleanup-v2
          fi
