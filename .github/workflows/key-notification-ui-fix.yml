name: Apply key and notifications UI fix
on:
  workflow_dispatch:
  push:
    branches: [fix/key-notification-ui]
    paths:
      - '.github/workflows/key-notification-ui-fix.yml'
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/key-notification-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply guarded UI patch
        run: python3 .github/ui-key-notification-patch.py
      - name: Syntax checks
        run: |
          node --check ui-clutter-cleanup-v2.js
          node --check ui-clutter-cleanup-v2-test.mjs
      - name: Targeted regression
        run: node ui-clutter-cleanup-v2-test.mjs
      - name: Full regression suite
        env:
          TELEPILOT_SECURITY_SECRET: test-only-key-notification-secret-0123456789abcdef
          TELEPILOT_SESSION_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-clutter-cleanup-v2.js ui-clutter-cleanup-v2-test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Refine notifications and add checkout key action'
            git push origin HEAD:fix/key-notification-ui
          fi
