name: Clean generated dependencies

on:
  push:
    branches:
      - feature/referrals-custom-interval

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/referrals-custom-interval
          fetch-depth: 0

      - name: Remove generated dependencies and add ignore rule
        run: |
          git rm -r --ignore-unmatch node_modules
          printf 'node_modules/\n' > .gitignore
          rm -f .github/workflows/cleanup-generated-deps.yml

      - name: Verify clean diff
        run: |
          git diff --check
          ! git ls-files | grep '^node_modules/'

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated dependencies from feature branch"
          git push origin HEAD:feature/referrals-custom-interval
