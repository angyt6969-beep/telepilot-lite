name: Topics label check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'destinations-v2-copy.js'
      - '.github/workflows/topics-label-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Topics label and callback
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const source = fs.readFileSync('destinations-v2-copy.js', 'utf8');
          assert.ok(source.includes('button.text = "💬 Topics";'));
          assert.ok(source.includes('button.callback_data = "d2_topics:0";'));
          assert.equal(source.includes('button.text = "💬 Destination Topics";'), false);
          console.log('Topics label check passed');
          NODE
      - run: npm test
