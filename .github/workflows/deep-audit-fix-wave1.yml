name: Deep audit fix wave 1

on:
  push:
    branches:
      - deep-audit-2026-09-09-final
    paths:
      - .github/workflows/deep-audit-fix-wave1.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply audited scheduler and client-IP fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # v1-engine: make Today a calendar-day statistic in the configured timezone.
          p = Path('v1-engine.js')
          s = p.read_text()
          old = '''export function v1Stats(uid,now=Date.now()) {
            const history=readV1(uid).history||[], day=86_400_000;
            const summarize=since=>{const rows=history.filter(i=>Number(i.ts||0)>=since);return{sent:rows.filter(i=>i.status==="sent").length,failed:rows.filter(i=>i.status==="failed").length,skipped:rows.filter(i=>i.status==="skipped").length};};
            return{today:summarize(now-day),week:summarize(now-7*day),total:summarize(0)};
          }'''.replace('            ', '')
          new = '''function localCalendarDayStart(pro,now=Date.now()) {
            const offset=Number(pro?.schedule?.utcOffsetMinutes||0)*60_000;
            const local=new Date(Number(now)+offset);
            return Date.UTC(local.getUTCFullYear(),local.getUTCMonth(),local.getUTCDate())-offset;
          }
          export function v1Stats(uid,now=Date.now()) {
            const pro=readV1(uid),history=pro.history||[],day=86_400_000;
            const summarize=since=>{const rows=history.filter(i=>Number(i.ts||0)>=since);return{sent:rows.filter(i=>i.status==="sent").length,failed:rows.filter(i=>i.status==="failed").length,skipped:rows.filter(i=>i.status==="skipped").length};};
            return{today:summarize(localCalendarDayStart(pro,now)),week:summarize(now-7*day),total:summarize(0)};
          }'''.replace('          ', '')
          if old not in s:
              raise SystemExit('v1Stats anchor missing')
          s = s.replace(old, new, 1)
          old_test = '''export const __test = {
            MEDIA_CAPTION_LIMIT,
            markPartialDelivery,
            botMediaDeliveryOptions,
            personalMediaDeliveryOptions,
          };'''.replace('          ', '')
          new_test = '''export const __test = {
            MEDIA_CAPTION_LIMIT,
            markPartialDelivery,
            botMediaDeliveryOptions,
            personalMediaDeliveryOptions,
            localCalendarDayStart,
          };'''.replace('          ', '')
          if old_test not in s:
              raise SystemExit('v1-engine __test anchor missing')
          s = s.replace(old_test, new_test, 1)
          p.write_text(s)

          # v1-worker: never consume missing-config jobs, and stop a scheduled cycle
          # immediately if access/pause state changes between Telegram deliveries.
          p = Path('v1-worker.js')
          s = p.read_text()
          has_access = 'function hasAccess(uid,settings){if(isAdmin(uid))return true;if(settings?.accessRevoked)return false;if(settings?.accessLifetime)return true;return Number(settings?.accessUntil||0)>Date.now();}'
          block_helper = has_access + '\nfunction scheduledBlockReason(uid){const latest=readAppSettings(uid);if(!hasAccess(uid,latest))return "Access is no longer active.";if(readV1(uid).paused===true)return "Posting is paused.";return "";}'
          if has_access not in s:
              raise SystemExit('hasAccess anchor missing')
          s = s.replace(has_access, block_helper, 1)
          s = s.replace('async function sendCycle(uid,settings,bot,options={}){', 'export async function sendCycle(uid,settings,bot,options={}){', 1)
          missing_old = 'if(!groups.length||!settings.adMessage)return{sent:0,failed:0,skipped:0,delivered:[],errors:["Missing message or destination"]};'
          missing_new = 'if(!groups.length||!settings.adMessage)return{sent:0,failed:0,skipped:1,delivered:[],errors:["Missing message or destination"]};'
          if missing_old not in s:
              raise SystemExit('missing-config anchor missing')
          s = s.replace(missing_old, missing_new, 1)
          loop_old = 'try{\n    for(const destination of groups){'
          loop_new = 'try{\n    deliveryLoop: for(const destination of groups){\n      const cycleBlock=scheduledBlockReason(uid);if(cycleBlock){skipped++;errors.push(cycleBlock);break;}'
          if loop_old not in s:
              raise SystemExit('destination loop anchor missing')
          s = s.replace(loop_old, loop_new, 1)
          account_old = 'for(const accountId of accountIds){\n        const key=deliveryId(destination,accountId);'
          account_new = 'for(const accountId of accountIds){\n        const accountBlock=scheduledBlockReason(uid);if(accountBlock){skipped++;errors.push(accountBlock);break deliveryLoop;}\n        const key=deliveryId(destination,accountId);'
          if account_old not in s:
              raise SystemExit('account loop anchor missing')
          s = s.replace(account_old, account_new, 1)
          old_export = 'export const __test={savedInputPeer,isPartialDeliveryError,accountStatusPatchForSendError,exactCycleComplete,applyOneTimeOutcome};'
          new_export = 'export const __test={savedInputPeer,isPartialDeliveryError,accountStatusPatchForSendError,exactCycleComplete,applyOneTimeOutcome,sendCycle,scheduledBlockReason};'
          if old_export not in s:
              raise SystemExit('worker __test anchor missing')
          s = s.replace(old_export, new_export, 1)
          p.write_text(s)

          # security-core: Railway publishes the client IP as X-Real-IP. Validate every
          # candidate and never let an arbitrary XFF value override a valid trusted value.
          p = Path('security-core.js')
          s = p.read_text()
          import_anchor = 'import crypto from "node:crypto";'
          if 'node:net' not in s:
              s = s.replace(import_anchor, import_anchor + '\nimport { isIP } from "node:net";', 1)
          old = '''export function requestAddress(req) {
            const forwarded = String(req?.headers?.["x-forwarded-for"] || "")
              .split(",")
              .map(value => value.trim())
              .filter(Boolean);
            return forwarded[forwarded.length - 1] || String(req?.socket?.remoteAddress || "unknown");
          }'''.replace('          ', '')
          new = '''function normalizedIp(value) {
            let candidate=String(value||"").trim();
            if(!candidate)return "";
            if(candidate.startsWith("::ffff:")){const mapped=candidate.slice(7);if(isIP(mapped)===4)return mapped;}
            return isIP(candidate)?candidate:"";
          }
          export function requestAddress(req) {
            const realHeader=Array.isArray(req?.headers?.["x-real-ip"])?req.headers["x-real-ip"][0]:req?.headers?.["x-real-ip"];
            const real=normalizedIp(realHeader);
            if(real)return real;
            const socket=normalizedIp(req?.socket?.remoteAddress);
            if(socket)return socket;
            const forwarded=String(req?.headers?.["x-forwarded-for"]||"").split(",").map(normalizedIp).find(Boolean);
            return forwarded||"unknown";
          }'''.replace('          ', '')
          if old not in s:
              raise SystemExit('requestAddress anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Make the new regression permanent on the audit branch.
          p = Path('package.json')
          s = p.read_text()
          old = 'node core-audit-regression-test.mjs && node deep-audit-static.mjs'
          new = 'node core-audit-regression-test.mjs && node deep-audit-regression-test.mjs && node deep-audit-static.mjs'
          if old not in s:
              if new not in s:
                  raise SystemExit('package test anchor missing')
          else:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          node --check v1-engine.js
          node --check v1-worker.js
          node --check security-core.js
          node security-tests.mjs
          node core-audit-regression-test.mjs
          node deep-audit-regression-test.mjs

      - name: Commit audited wave 1
        shell: bash
        run: |
          rm .github/workflows/deep-audit-fix-wave1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1-engine.js v1-worker.js security-core.js package.json deep-audit-regression-test.mjs .github/workflows/deep-audit-fix-wave1.yml
          git commit -m "Fix scheduler state checks and Railway client IP handling"
          git push origin HEAD:deep-audit-2026-09-09-final
