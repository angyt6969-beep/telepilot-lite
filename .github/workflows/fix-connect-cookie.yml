name: Repair TelePilot tutorial continuation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-connect-cookie.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply continuation patch
        run: python3 scripts/fix_tutorial_continuation.py
      - name: Validate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check app.js
          node --check onboarding.js
          node onboarding-continuation-test.mjs
          grep -q 'advanceTutorialAfterAction(attempt.uid, 2, 3)' app.js
          grep -q 'advanceTutorialAfterAction(state.uid, 3, 4)' app.js
          grep -q 'advanceTutorialAfterAction(state.uid, 4, 5)' app.js
          grep -q 'advanceTutorialAfterAction(state.uid, 5, 6)' app.js
          npm test
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js onboarding.js onboarding-continuation-test.mjs
          git commit -m 'Keep interactive tutorial moving after setup actions'
          git push origin HEAD:main
