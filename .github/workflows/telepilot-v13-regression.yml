name: TelePilot v1.3 Regression

on:
  push:
    branches:
      - main
      - telepilot-v13-qol
      - telepilot-v13-ui-polish
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: /tmp/telepilot-v13-ci
      TELEPILOT_SECURITY_SECRET: v13-regression-security-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      TELEPILOT_SESSION_KEY_B64: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws=
      TELEPILOT_SUPPORT_USERNAME: vvschrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check startup.js
          node --check app.js
          node --check account-store.js
          node --check destination-automation.js
          node --check qol-store.js
          node --check ux-v13.js
          node --check ux-v13-polish.js
          node --check ux-v13-visual-polish.js
          node --check onboarding.js
          node --check runtime-hooks.js
          node --check v1-engine.js
          node --check v1-worker.js
          node --check telepilot-v13-regression-test.mjs
          node --check telepilot-v13-runtime-test.mjs
          node --check telepilot-v13-visual-polish-test.mjs
      - name: Full regression suite
        run: npm test
