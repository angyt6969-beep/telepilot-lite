name: Apply TelePilot access rebrand

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-vvschrome-access-rebrand.mjs
      - .github/workflows/apply-vvschrome-access-rebrand.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix helper quoting and apply source rewrite
        run: |
          python3 -c 'from pathlib import Path; p=Path("scripts/apply-vvschrome-access-rebrand.mjs"); s=p.read_text(); s=s.replace("      `<i>Owner & support: @${TELEPILOT_OWNER_USERNAME}</i>`,", "      \"<i>Owner & support: @\" + TELEPILOT_OWNER_USERNAME + \"</i>\","); p.write_text(s)'
          node --check scripts/apply-vvschrome-access-rebrand.mjs
          node scripts/apply-vvschrome-access-rebrand.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check changed source
        run: |
          node --check startup.js
          node --check free-trial.js
          node --check tutorial-final-access-ui.js
      - name: Run full regression suite
        run: |
          export DATA_DIR=/tmp/telepilot-access-rebrand-ci
          export TELEPILOT_SECURITY_SECRET=$(node -e "process.stdout.write('x'.repeat(48))")
          export TELEPILOT_SESSION_KEY_B64=$(node -e "process.stdout.write(Buffer.alloc(32,11).toString('base64'))")
          export TELEPILOT_SUPPORT_USERNAME=vvschrome
          npm test
      - name: Commit verified rewrite
        run: |
          rm -f scripts/apply-vvschrome-access-rebrand.mjs .github/workflows/apply-vvschrome-access-rebrand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace tutorial start with key access and rebrand owner"
          git push origin HEAD:main
