name: TelePilot Final Neutral Button Fix

on:
  push:
    paths:
      - .github/workflows/fix-neutral-buttons-final.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch final outgoing button payload
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('global-ui-polish.js')
          text = path.read_text()

          old = '''  next.reply_markup.inline_keyboard = next.reply_markup.inline_keyboard.map(row => row.map(source => {
    const button = { ...source };
    // Existing premium buttons are deliberately preserved byte-for-byte.
    if (button.icon_custom_emoji_id) return button;
'''
          new = '''  next.reply_markup.inline_keyboard = next.reply_markup.inline_keyboard.map(row => row.map(source => {
    const button = { ...source };
    const callback = String(button?.callback_data || "").toLowerCase();
    // These navigation buttons must remain Telegram's neutral/default gray,
    // even when they already carry a premium custom emoji or an upstream style.
    if (callback === "v1_tools" || callback === "v1_dest_add_v13" || callback === "v1_history") {
      delete button.style;
    }
    // Existing premium buttons keep their premium icon after neutral style is enforced.
    if (button.icon_custom_emoji_id) return button;
'''
          if old not in text:
              raise SystemExit('premiumizeButtons anchor not found')
          text = text.replace(old, new, 1)

          old2 = '  if (callback === "v1_tools" || callback === "v1_dest_add_v13") return undefined;\n'
          new2 = '  if (callback === "v1_tools" || callback === "v1_dest_add_v13" || callback === "v1_history") return undefined;\n'
          if old2 not in text:
              raise SystemExit('buttonStyle neutral rule not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text)
          PY

      - name: Validate source
        shell: bash
        run: |
          node --check global-ui-polish.js
          grep -q 'callback === "v1_tools" || callback === "v1_dest_add_v13" || callback === "v1_history"' global-ui-polish.js
          grep -q 'delete button.style' global-ui-polish.js

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-neutral-buttons-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-ui-polish.js .github/workflows/fix-neutral-buttons-final.yml
          git commit -m "Enforce gray Advanced Add Import and History buttons"
          git push origin HEAD:main

# trigger 2
