name: TelePilot neutral buttons

on: push

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply neutral button fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('global-ui-polish.js')
          s = p.read_text()
          old = '''    const button = { ...source };
    // Existing premium buttons are deliberately preserved byte-for-byte.
    if (button.icon_custom_emoji_id) return button;
'''
          new = '''    const button = { ...source };
    const callback = String(button?.callback_data || "").toLowerCase();
    if (callback === "v1_tools" || callback === "v1_dest_add_v13" || callback === "v1_history") delete button.style;
    // Existing premium buttons keep their icon after neutral style is enforced.
    if (button.icon_custom_emoji_id) return button;
'''
          if old not in s:
              raise SystemExit('premium button anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('if (callback === "v1_tools" || callback === "v1_dest_add_v13") return undefined;', 'if (callback === "v1_tools" || callback === "v1_dest_add_v13" || callback === "v1_history") return undefined;', 1)
          p.write_text(s)
          PY
          node --check global-ui-polish.js
          grep -q 'v1_history' global-ui-polish.js
          grep -q 'delete button.style' global-ui-polish.js
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/fix-neutral-buttons-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add global-ui-polish.js .github/workflows/fix-neutral-buttons-final.yml
          git commit -m 'Enforce gray Advanced Add Import and History buttons'
          git push origin HEAD:main
