name: Apply referral and custom interval patch

on:
  push:
    branches:
      - feature/referrals-custom-interval

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/referrals-custom-interval
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply guarded source patch
        run: node scripts/apply-referral-custom-interval-patch.mjs

      - name: Syntax checks
        run: |
          node --check app.js
          node --check startup.js
          node --check interval-settings.js
          node --check referral-system.js
          node --check ux-v13.js
          node --check referral-custom-interval-test.mjs

      - name: Full regression suite
        run: |
          export TELEPILOT_SECURITY_SECRET="$(node -p "'x'.repeat(48)")"
          export TELEPILOT_SESSION_KEY_B64="$(node -p "Buffer.alloc(32, 11).toString('base64')")"
          export DATA_DIR=/tmp/telepilot-referral-interval-ci
          npm test

      - name: Diff check
        run: git diff --check

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add referrals and custom second/minute intervals"
          git push origin HEAD:feature/referrals-custom-interval
