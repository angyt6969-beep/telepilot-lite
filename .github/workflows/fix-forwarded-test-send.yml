name: Fix Forwarded Test Send

on:
  push:
    paths:
      - .github/workflows/fix-forwarded-test-send.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rewrite Forwarded Post owner paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          # forwarded-post-v1.js owns mode state and the real Telegram forward operation.
          path = Path("forwarded-post-v1.js")
          text = path.read_text()

          mode_helper = r'''function isForwardedModeLine(line) {
            const plain = String(line || "")
              .replace(/<tg-emoji[^>]*>.*?<\/tg-emoji>/gis, "")
              .replace(/<[^>]+>/g, "")
              .replace(/[*_`~]/g, "")
              .trim();
            return /^Mode\s*:?\s*[—-]\s*/i.test(plain);
          }

          export function normalizeForwardedModeLine(text, cfg) {
            const mode = cfg?.enabled
              ? `Forwarded Post · ${cfg.sourceLabel || cfg.sourcePeer}`
              : "Normal Post";
            const lines = String(text || "").split("\n").filter(line => !isForwardedModeLine(line));
            while (lines.length && !lines.at(-1).trim()) lines.pop();
            const base = lines.join("\n");
            return base ? `${base}\n\nMode — ${mode}` : `Mode — ${mode}`;
          }

          '''
          text = replace_once(
              text,
              'function messageMenuPayload(uid, payload) {',
              mode_helper + 'function messageMenuPayload(uid, payload) {',
              "insert canonical mode renderer",
          )

          old_mode = r'''  let text = String(payload.text || "");
            if (text && !/\nMode\s+[—-]/i.test(text)) {
              const mode = cfg.enabled
                ? `Forwarded Post · ${cfg.sourceLabel || cfg.sourcePeer}`
                : "Normal Post";
              text += `\n\nMode — ${mode}`;
            }
          '''
          new_mode = r'''  const text = normalizeForwardedModeLine(payload.text, cfg);
          '''
          text = replace_once(text, old_mode, new_mode, "replace additive mode rendering")

          first_result = r'''function firstForwardedResult(value) {
            if (Array.isArray(value)) {
              for (const item of value) {
                const found = firstForwardedResult(item);
                if (found) return found;
              }
              return null;
            }
            return value || null;
          }
          '''
          helper = first_result + r'''
          export async function forwardConfiguredPost(client, cfg, entity, params = {}, options = {}) {
            if (!cfg?.enabled || !cfg?.sourcePeer || Number(cfg?.sourceMessageId || 0) < 1) return null;
            const resolveSource = typeof options.resolveSource === "function" ? options.resolveSource : resolveForwardSourcePeer;
            const source = await resolveSource(client, cfg);
            const threadId = threadIdFromSendParams(params);
            const forwarded = await client.forwardMessages(entity, {
              messages: Number(cfg.sourceMessageId),
              fromPeer: source,
              ...(threadId > 1 ? { topMsgId: threadId, replyTo: params?.replyTo || threadId } : {}),
            });
            const result = firstForwardedResult(forwarded);
            if (!result) throw new Error("Telegram did not confirm the forwarded post.");
            return result;
          }
          '''
          text = replace_once(text, first_result, helper, "insert shared forwarding helper")

          old_forward_body = r'''      const source = await resolveSource(this, cfg);
                const threadId = threadIdFromSendParams(params);
                const forwarded = await this.forwardMessages(entity, {
                  messages: Number(cfg.sourceMessageId),
                  fromPeer: source,
                  ...(threadId > 1 ? { topMsgId: threadId, replyTo: params?.replyTo || threadId } : {}),
                });
                const result = firstForwardedResult(forwarded);
                if (!result) throw new Error("Telegram did not confirm the forwarded post.");
                return completeExternalPersonalDispatch(dispatchHandle, result);
          '''
          new_forward_body = r'''      const result = await forwardConfiguredPost(this, cfg, entity, params, { resolveSource });
                return completeExternalPersonalDispatch(dispatchHandle, result);
          '''
          text = replace_once(text, old_forward_body, new_forward_body, "share production forward operation")
          path.write_text(text)

          # v1.3 must reuse the same idempotent mode renderer instead of maintaining a second regex.
          path = Path("forwarded-post-v13-ui-fix.js")
          text = path.read_text()
          text = replace_once(
              text,
              'import { readForwardedPostConfig } from "./forwarded-post-v1.js";',
              'import { normalizeForwardedModeLine, readForwardedPostConfig } from "./forwarded-post-v1.js";',
              "share mode renderer import",
          )
          old_v13_mode = r'''function withModeLine(text, cfg) {
            const value = String(text || "");
            const mode = cfg?.enabled
              ? `Forwarded Post · ${cfg.sourceLabel || cfg.sourcePeer}`
              : "Normal Post";
            if (/\nMode\s+[—-]\s*[^\n]*/i.test(value)) {
              return value.replace(/\nMode\s+[—-]\s*[^\n]*/i, `\nMode — ${mode}`);
            }
            return `${value}\n\nMode — ${mode}`;
          }
          '''
          new_v13_mode = r'''function withModeLine(text, cfg) {
            return normalizeForwardedModeLine(text, cfg);
          }
          '''
          text = replace_once(text, old_v13_mode, new_v13_mode, "remove duplicate v13 mode implementation")
          path.write_text(text)

          # pro-controls.js owns Test send. Make it explicitly respect the selected post mode.
          path = Path("pro-controls.js")
          text = path.read_text()
          text = replace_once(
              text,
              'import { withDispatchContext } from "./dispatch-context.js";\n',
              'import { withDispatchContext } from "./dispatch-context.js";\nimport { forwardConfiguredPost, readForwardedPostConfig } from "./forwarded-post-v1.js";\n',
              "import forwarded test helpers",
          )

          pattern = re.compile(r'async function sendTest\(ctx\) \{.*?\n\}\n\nasync function checkDestinationHealth', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit("sendTest rewrite: function block not found")
          send_test = r'''async function sendTest(ctx) {
            const uid = uidOf(ctx);
            const settings = readAppSettings(uid);
            const pro = readProSettings(uid);
            const forwardedConfig = readForwardedPostConfig(uid);
            const forwarding = forwardedConfig.enabled === true;
            const destination = { id: String(ctx.chat.id), label: "Test preview", username: "" };
            const accounts = listAccounts(uid);
            const ids = effectiveAccountIds(settings, null, accounts);

            if (!forwarding && !settings.adMessage) {
              return ctx.answerCallbackQuery({ text: "Create a message first.", show_alert: true });
            }
            if (forwarding && !ids.length) {
              return ctx.answerCallbackQuery({
                text: "Forwarded Post requires a selected personal Telegram sender.",
                show_alert: true,
              });
            }

            await ctx.answerCallbackQuery({ text: forwarding ? "Sending forwarded test…" : "Sending test…" });

            if (ids.length) {
              let sent = 0;
              let failed = 0;
              const errors = [];
              for (const id of ids) {
                const account = accounts.find(item => item.id === id);
                let client;
                try {
                  client = await openPersonalClient(uid, id);
                  if (forwarding) {
                    await forwardConfiguredPost(client, forwardedConfig, "me");
                  } else {
                    const rendered = renderDynamicMessage(settings.adMessage, settings.adEntities || [], {
                      pro,
                      destination,
                      sender: accountDisplayLabel(account),
                    });
                    const mt = toMtprotoEntities(rendered.entities);
                    if (pro.media?.localPath && fs.existsSync(pro.media.localPath)) {
                      await client.sendFile("me", {
                        file: pro.media.localPath,
                        caption: rendered.text,
                        ...(mt.length ? { formattingEntities: mt } : {}),
                        forceDocument: pro.media.kind === "document",
                        supportsStreaming: pro.media.kind === "video",
                      });
                    } else {
                      await client.sendMessage("me", {
                        message: rendered.text || "\u2063",
                        ...(mt.length ? { formattingEntities: mt } : {}),
                      });
                    }
                  }
                  sent++;
                } catch (err) {
                  failed++;
                  if (errors.length < 3) errors.push(String(err?.message || err).slice(0, 180));
                } finally {
                  try { await client?.disconnect(); } catch {}
                }
              }

              if (forwarding) {
                const summary = sent
                  ? `✅ Forwarded test complete — ${sent} sender${sent === 1 ? "" : "s"} received the real forwarded post in Saved Messages.`
                  : "❌ Forwarded test failed — no sender received the source post.";
                const detail = errors.length ? `\n\n${errors.join("\n")}` : "";
                await ctx.reply(`${summary}${failed ? `\n${failed} sender${failed === 1 ? "" : "s"} failed.` : ""}${detail}`);
              } else {
                await ctx.reply(`✅ Test complete — ${sent} sender${sent === 1 ? "" : "s"} received it in Saved Messages${failed ? ` • ${failed} failed` : ""}.`);
              }
              return;
            }

            // Bot-mode test sends remain normal posts. Forwarded Post never silently
            // falls back to the bot because Telegram forwarding requires a personal sender.
            const rendered = renderDynamicMessage(settings.adMessage, settings.adEntities || [], {
              pro,
              destination,
              sender: "TelePilot Bot",
            });
            if (pro.media?.fileId) {
              const options = {
                ...(rendered.text ? { caption: rendered.text } : {}),
                ...(rendered.entities.length ? { caption_entities: rendered.entities } : {}),
              };
              if (pro.media.kind === "photo") await ctx.api.sendPhoto(ctx.chat.id, pro.media.fileId, options);
              else if (pro.media.kind === "video") await ctx.api.sendVideo(ctx.chat.id, pro.media.fileId, { ...options, supports_streaming: true });
              else if (pro.media.kind === "animation") await ctx.api.sendAnimation(ctx.chat.id, pro.media.fileId, options);
              else await ctx.api.sendDocument(ctx.chat.id, pro.media.fileId, options);
            } else {
              await ctx.api.sendMessage(
                ctx.chat.id,
                rendered.text || "\u2063",
                rendered.entities.length ? { entities: rendered.entities } : {},
              );
            }
          }

          async function checkDestinationHealth'''
          text = text[:match.start()] + send_test + text[match.end():]
          path.write_text(text)

          # Extend existing forwarding tests with the two regressions from the screenshots.
          path = Path("forwarded-post-v1-test.mjs")
          text = path.read_text()
          text = replace_once(
              text,
              '  installForwardedPostSend,\n',
              '  forwardConfiguredPost,\n  installForwardedPostSend,\n  normalizeForwardedModeLine,\n',
              "test imports",
          )
          anchor = 'assert.match(decorated.text, /Mode — Normal Post/);\n'
          addition = anchor + r'''

          const cleanedModes = normalizeForwardedModeLine([
            "📝 Message",
            "● Ready",
            "",
            "Mode — Normal Post",
            "",
            "Mode: — Normal Post",
            "",
            "<b>Mode:</b> — Forwarded Post · Old Source",
          ].join("\n"), {
            enabled: true,
            sourcePeer: "@premiumsource",
            sourceLabel: "Premium Source",
          });
          const plainModes = cleanedModes.replace(/<[^>]+>/g, "").replace(/[*_`~]/g, "");
          assert.equal((plainModes.match(/^Mode\s*:?\s*[—-]/gmi) || []).length, 1);
          assert.match(cleanedModes, /Mode — Forwarded Post · Premium Source/);
          '''
          text = replace_once(text, anchor, addition, "mode idempotence regression")
          anchor = 'const client = new FakeClient();\n'
          addition = anchor + r'''
          const directForward = await forwardConfiguredPost(client, {
            enabled: true,
            sourcePeer: "@premiumsource",
            sourceMessageId: 91,
          }, "me");
          assert.equal(directForward.id, 999);
          assert.equal(forwardCall.entity, "me");
          assert.equal(forwardCall.params.messages, 91);
          assert.equal(forwardCall.params.fromPeer, "resolved:@premiumsource");
          forwardCall = null;
          '''
          text = replace_once(text, anchor, addition, "shared forward helper regression")
          path.write_text(text)

          path = Path("forwarded-post-v13-ui-fix-test.mjs")
          text = path.read_text()
          anchor = 'assert.equal(secondPass.reply_markup.inline_keyboard.flat().filter(button => String(button.callback_data || "").startsWith("fp_")).length, 2);\n'
          addition = anchor + r'''

          const messyModePass = decorateV13ForwardedPostMenu("12345", {
            ...enabled,
            text: `${enabled.text.replace("Mode —", "Mode: —")}\n\n<b>Mode:</b> — Normal Post`,
          }, {
            readConfig: () => ({
              enabled: true,
              sourcePeer: "@premiumsource",
              sourceMessageId: 91,
              sourceLabel: "Premium Source",
            }),
          });
          const messyPlain = messyModePass.text.replace(/<[^>]+>/g, "").replace(/[*_`~]/g, "");
          assert.equal((messyPlain.match(/^Mode\s*:?\s*[—-]/gmi) || []).length, 1);
          assert.match(messyModePass.text, /Mode — Forwarded Post · Premium Source/);
          '''
          text = replace_once(text, anchor, addition, "v13 duplicate mode regression")
          path.write_text(text)

          path = Path("forwarding-deep-audit-test.mjs")
          text = path.read_text()
          anchor = 'assert.equal(forwarded.__test.firstForwardedResult([[null], [{ id: 7 }]])?.id, 7);\n'
          addition = anchor + r'''

          const proControlsSource = fs.readFileSync(new URL("./pro-controls.js", import.meta.url), "utf8");
          assert.match(proControlsSource, /const forwardedConfig = readForwardedPostConfig\(uid\)/);
          assert.match(proControlsSource, /await forwardConfiguredPost\(client, forwardedConfig, "me"\)/);
          assert.match(proControlsSource, /Forwarded Post requires a selected personal Telegram sender/);
          '''
          text = replace_once(text, anchor, addition, "test-send integration regression")
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate rewritten forwarding paths
        run: |
          node --check forwarded-post-v1.js
          node --check forwarded-post-v13-ui-fix.js
          node --check pro-controls.js
          node forwarded-post-v1-test.mjs
          node forwarded-post-v13-ui-fix-test.mjs
          node forwarding-deep-audit-test.mjs

      - name: Commit owner-code rewrite and remove temporary workflow
        run: |
          rm .github/workflows/fix-forwarded-test-send.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix forwarded test send and idempotent mode UI"
          git push origin HEAD:main
