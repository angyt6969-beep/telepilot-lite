name: TelePilot UI Small Cleanup

on:
  push:
    paths:
      - .github/workflows/ui-small-cleanup.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rewrite owning UI code
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Advanced + Add / Import: neutral gray instead of primary blue.
          path = Path('global-ui-polish.js')
          text = path.read_text()
          anchor = '  const haystack = `${button?.callback_data || ""} ${button?.text || ""}`.toLowerCase();\n'
          insert = (
              '  const callback = String(button?.callback_data || "").toLowerCase();\n'
              '  // Ordinary navigation/setup controls stay neutral gray.\n'
              '  if (callback === "v1_tools" || callback === "v1_dest_add_v13") return undefined;\n'
              + anchor
          )
          if 'callback === "v1_tools" || callback === "v1_dest_add_v13"' not in text:
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'global-ui-polish buttonStyle anchor count: {count}')
              text = text.replace(anchor, insert, 1)
          path.write_text(text)

          # Activity: expose today's sent and failed totals as clear separate metrics.
          path = Path('ux-v13.js')
          text = path.read_text()
          today = '      `Today  ✅ ${stats.today.sent} · ❌ ${stats.today.failed} · ↷ ${stats.today.skipped}`,\n'
          replacement = (
              '      `Sent today  ✅ ${stats.today.sent}`,\n'
              '      `Failed today  ❌ ${stats.today.failed}`,\n'
              '      stats.today.skipped ? `Skipped today  ↷ ${stats.today.skipped}` : null,\n'
          )
          if '`Sent today  ✅ ${stats.today.sent}`' not in text:
              count = text.count(today)
              if count != 1:
                  raise SystemExit(f'ux-v13 Activity Today line count: {count}')
              text = text.replace(today, replacement, 1)
          path.write_text(text)
          PY

      - name: Validate rewritten source
        shell: bash
        run: |
          node --check global-ui-polish.js
          node --check ux-v13.js
          python3 <<'PY'
          from pathlib import Path
          polish = Path('global-ui-polish.js').read_text()
          ux = Path('ux-v13.js').read_text()
          assert 'callback === "v1_tools" || callback === "v1_dest_add_v13"' in polish
          assert '`Sent today  ✅ ${stats.today.sent}`' in ux
          assert '`Failed today  ❌ ${stats.today.failed}`' in ux
          assert '`Today  ✅ ${stats.today.sent}' not in ux
          print('Targeted UI assertions passed')
          PY

      - name: Commit direct source changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/ui-small-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-ui-polish.js ux-v13.js .github/workflows/ui-small-cleanup.yml
          git commit -m "Refine neutral buttons and Activity daily counts"
          git push origin HEAD:main
