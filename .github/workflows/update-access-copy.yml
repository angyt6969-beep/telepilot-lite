name: Update TelePilot access key copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-access-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update access copy and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          replacements = [
              (
                  'Redeem a valid access key to use TelePilot.',
                  'An access key is required to use TelePilot.\\\n\\\nNeed a key? Message @noahxrp to get yours.'
              ),
              (
                  'Send your TelePilot access key.',
                  'Send your TelePilot access key below.\\\n\\\nNeed a key? Message @noahxrp to get yours.'
              ),
              ('Example: TP-XXXX-XXXX-XXXX', 'Example: TP-XXXXX-XXXXX-XXXXX-XXXXX'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}; refusing to patch.')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check app.js
          grep -q 'Need a key? Message @noahxrp to get yours.' app.js
          grep -q 'Example: TP-XXXXX-XXXXX-XXXXX-XXXXX' app.js
      - name: Commit copy update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Tell users how to get a TelePilot access key"
          git push origin HEAD:main
