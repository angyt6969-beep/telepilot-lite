name: TelePilot 1.1 Build

on:
  push:
    branches: [telepilot-v2-routing]
    paths:
      - ".github/workflows/telepilot-v11-build.yml"

permissions:
  contents: write

jobs:
  migrate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telepilot-v2-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply pending onboarding migration
        run: python3 scripts/telepilot_v11_patch_onboarding.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check onboarding.js
          node --check v1-extras.js
          node --check v1-ui.js
      - name: TelePilot 1.1 onboarding invariants
        run: |
          grep -q "hasAnyAccount" onboarding.js
          grep -q "senderSummary" onboarding.js
          grep -q "advanceTutorialAfterAction(uid, 6, 7)" v1-extras.js
          grep -q "What's new in TelePilot 1.1" v1-ui.js
      - name: Commit migrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onboarding.js v1-extras.js v1-ui.js
          if git diff --cached --quiet; then
            echo "No generated source changes."
            exit 0
          fi
          git commit -m "Finish TelePilot 1.1 tutorial integration"
          git push origin HEAD:telepilot-v2-routing
