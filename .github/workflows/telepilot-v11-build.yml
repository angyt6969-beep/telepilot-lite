name: TelePilot 1.1 Build

on:
  push:
    branches: [telepilot-v2-routing]
    paths:
      - ".github/workflows/telepilot-v11-build.yml"
      - "scripts/telepilot_v11_release_gate_fix.py"

permissions:
  contents: write

jobs:
  migrate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telepilot-v2-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply release-gate fixes
        run: python3 scripts/telepilot_v11_release_gate_fix.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          for f in app.js account-store.js sender-destination-ui.js v1-extras.js v1-worker.js telepilot-v11-regression-test.mjs; do node --check "$f"; done
      - name: Full regression suite
        env:
          TELEPILOT_SECURITY_SECRET: test-only-regression-secret-012345678901234567890
        run: npm test
      - name: Release-gate invariants
        run: |
          grep -q "usesBotSender" account-store.js
          grep -q "account_mode_bot" app.js
          grep -q "usesBotSender" v1-worker.js
          grep -q "senderSummary" v1-extras.js
          ! grep -q "personal-session.enc" sender-destination-ui.js
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js account-store.js sender-destination-ui.js v1-extras.js v1-worker.js telepilot-v11-regression-test.mjs
          if git diff --cached --quiet; then
            echo "No generated source changes."
            exit 0
          fi
          git commit -m "Fix TelePilot 1.1 sender routing release blockers"
          git push origin HEAD:telepilot-v2-routing
