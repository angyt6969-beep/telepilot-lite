name: TelePilot 1.1 Build

on:
  push:
    branches: [telepilot-v2-routing]
    paths:
      - ".github/workflows/telepilot-v11-build.yml"

permissions:
  contents: write

jobs:
  migrate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telepilot-v2-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply development migrations
        run: |
          python3 scripts/telepilot_v11_patch_app.py
          python3 scripts/telepilot_v11_patch_app_followup.py
          python3 scripts/telepilot_v11_patch_controls.py
          python3 scripts/telepilot_v11_patch_safety.py
          python3 scripts/telepilot_v11_patch_onboarding.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check app.js
          node --check pro-controls.js
          node --check v1-controls.js
          node --check v1-worker.js
          node --check support-center.js
          node --check security-core.js
          node --check onboarding.js
          node --check v1-extras.js
          node --check v1-ui.js
      - name: TelePilot 1.1 invariants
        run: |
          grep -q "TELEPILOT_MULTI_ACCOUNT_V11" app.js
          grep -q "postingEnabled" app.js
          grep -q "accessGrants" app.js
          grep -q "loadPersistedLogins" app.js
          grep -q "What's new in TelePilot 1.1" v1-controls.js
          grep -q "strictDateParts" v1-controls.js
          grep -q "permanentCount" v1-engine.js
          grep -q "EXACT_CATCHUP_MS" v1-worker.js
          grep -q "hasAnyAccount" onboarding.js
          grep -q "advanceTutorialAfterAction(uid, 6, 7)" v1-extras.js
          ! grep -R "getDialogs({ limit: 500 })" app.js pro-controls.js v1-worker.js
      - name: Commit migrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js pro-controls.js v1-controls.js support-center.js security-core.js onboarding.js v1-extras.js v1-ui.js
          if git diff --cached --quiet; then
            echo "No generated source changes."
            exit 0
          fi
          git commit -m "Apply TelePilot 1.1 onboarding and routing migration"
          git push origin HEAD:telepilot-v2-routing
