name: Apply TelePilot admin panel

on:
  push:
    branches:
      - feature/admin-panel
    paths:
      - scripts/apply-admin-panel.cjs
      - scripts/admin-panel-fragment-00.txt
      - scripts/admin-panel-fragment-01.txt
      - scripts/admin-panel-fragment-02.txt
      - scripts/admin-panel-fragment-03.txt
      - .github/workflows/apply-admin-panel.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-panel

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply deterministic patch
        run: node scripts/apply-admin-panel.cjs

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add TelePilot admin panel and remove destination cap"
          git push origin HEAD:feature/admin-panel
