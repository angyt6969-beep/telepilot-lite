name: Fix final live TelePilot UI

on:
  push:
    paths:
      - .github/workflows/fix-final-live-ui.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fix final live renderer and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ui-clutter-cleanup-v2.js')
          s = p.read_text()

          replacements = [
              (
                  'cleanActionButton(buttonByData(other, "v1_tools"), "Advanced", "v1_tools", "primary"),',
                  'cleanActionButton(buttonByData(other, "v1_tools"), "Advanced", "v1_tools"),',
              ),
              (
                  'rows.push([cleanActionButton(buttonByData(other, "history", "v1_history") || buttonByText(other, /history/i), "History", "history", "primary")]);',
                  'rows.push([cleanActionButton(buttonByData(other, "history", "v1_history") || buttonByText(other, /history/i), "History", "history")]);',
              ),
              (
                  'cleanActionButton(addTemplate, "Add / Import", String(addTemplate?.callback_data || "d2_add"), "primary"),',
                  'cleanActionButton(addTemplate, "Add / Import", String(addTemplate?.callback_data || "d2_add")),',
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing source anchor: {old}')
              s = s.replace(old, new, 1)

          marker = '    attention ? `<b>Attention:</b> — ${attention} destination${attention === 1 ? "" : "s"} need review` : null,'
          daily = [
              '    `<b>Sent today:</b> — ${firstNumber(metric(lines, "Sent today"))}`,' ,
              '    `<b>Failed today:</b> — ${firstNumber(metric(lines, "Failed today"))}`,' ,
          ]
          rows = s.splitlines()
          if not any('`<b>Sent today:</b>' in line for line in rows):
              try:
                  i = rows.index(marker)
              except ValueError:
                  raise SystemExit('activity attention anchor missing')
              rows[i + 1:i + 1] = daily
          s = '\n'.join(rows) + ('\n' if s.endswith('\n') else '')
          p.write_text(s)

          t = Path('ui-clutter-cleanup-v2-test.mjs')
          q = t.read_text()
          q = q.replace(
              'assert.equal(buttons(posting).find(item => item.callback_data === "v1_tools")?.style, "primary");',
              'assert.equal(buttons(posting).find(item => item.callback_data === "v1_tools")?.style, undefined);',
              1,
          )
          q = q.replace(
              'assert.equal(buttons(activity).find(item => item.callback_data === "history")?.style, "primary");',
              'assert.equal(buttons(activity).find(item => item.callback_data === "history")?.style, undefined);',
              1,
          )
          q = q.replace(
              'assert.equal(buttons(destinations).find(item => item.callback_data === "d2_add")?.style, "primary");',
              'assert.equal(buttons(destinations).find(item => item.callback_data === "d2_add")?.style, undefined);',
              1,
          )
          old_activity = 'const activity = cleanupUiClutterV2(42, "📊 Activity\\n\\nPosting: — 🟢 Running\\nNext: — 12m\\nDestination health: — 4 ready / 6 total\\nNeeds attention: — 2\\n\\nRecent\\n✅ @group · 2m ago", activityOther);'
          new_activity = 'const activity = cleanupUiClutterV2(42, "📊 Activity\\n\\nPosting: — 🟢 Running\\nNext: — 12m\\nDestination health: — 4 ready / 6 total\\nNeeds attention: — 2\\nSent today: — ✅ 17\\nFailed today: — ❌ 2\\n\\nRecent\\n✅ @group · 2m ago", activityOther);'
          if old_activity not in q:
              raise SystemExit('activity test input anchor missing')
          q = q.replace(old_activity, new_activity, 1)
          anchor = 'assert.match(plain(activity.text), /Open Issues to fix them/);'
          if anchor not in q:
              raise SystemExit('activity assertion anchor missing')
          q = q.replace(anchor, anchor + '\nassert.match(plain(activity.text), /Sent today: — 17/);\nassert.match(plain(activity.text), /Failed today: — 2/);', 1)
          t.write_text(q)
          PY

          node --check ui-clutter-cleanup-v2.js
          node ui-clutter-cleanup-v2-test.mjs

      - name: Commit final live UI fix
        shell: bash
        run: |
          rm .github/workflows/fix-final-live-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-clutter-cleanup-v2.js ui-clutter-cleanup-v2-test.mjs .github/workflows/fix-final-live-ui.yml
          git commit -m "Fix final live UI colors and daily activity counts"
          git push origin HEAD:main
