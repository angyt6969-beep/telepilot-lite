name: Validate TelePilot admin panel

on:
  push:
    branches:
      - feature/admin-panel-final
    paths:
      - app.js
      - package.json
      - .github/workflows/validate-admin-panel.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check app syntax
        run: node --check app.js
      - name: Verify Telegram keyboard APIs used by the admin panel
        run: |
          node --input-type=module - <<'NODE'
          import { InlineKeyboard } from "grammy";
          const keyboard = new InlineKeyboard()
            .text("Admin", "admin").primary().row()
            .copyText("Copy", "TP-TEST").row()
            .text("Delete", "delete").danger().row()
            .text("Confirm", "confirm").success();
          const json = JSON.stringify(keyboard);
          for (const field of ["primary", "copy_text", "danger", "success"]) {
            if (!json.includes(field)) throw new Error(`Missing keyboard API output: ${field}`);
          }
          console.log("Keyboard API validation passed");
          NODE
