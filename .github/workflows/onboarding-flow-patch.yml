name: Apply TelePilot onboarding flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/onboarding-flow-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply onboarding flow patch
        run: python3 scripts/patch_onboarding_flow.py
      - name: Validate onboarding flow
        run: |
          node --check app.js
          node --check onboarding.js
          grep -q 'Start Tutorial' app.js
          grep -q 'onboarding:access' onboarding.js
          grep -q 'Step 1 of 5' onboarding.js
          grep -q 'Open Smart Preview' onboarding.js
      - name: Run security regression tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Commit onboarding flow
        run: |
          if git diff --quiet -- app.js; then
            echo 'Onboarding flow already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Start tutorial after first access activation'
          git push origin HEAD:main
